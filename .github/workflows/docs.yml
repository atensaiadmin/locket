name: Docs (GitHub Pages)

# Publishes the public user-guide docs (docs/) as a GitHub Pages site.
# Trigger: push to main, or manual dispatch from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Copy the public docs into a standalone site.
      - name: Build docs site
        run: |
          mkdir -p _site
          cp -a docs/. _site/
          # Make docs/index at the root: link overview.md as the landing page.
          cp docs/overview.md _site/index.md
          echo "<meta http-equiv='refresh' content='0; url=./overview.html'>" > _site/index.html
          echo "Site contents:"
          ls -la _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
