name: Release

# Builds Locket release binaries and attaches them to a GitHub Release.
# Trigger: push a tag like v0.1.0  →  git push origin v0.1.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build release zips
        run: |
          VERSION="${GITHUB_REF_NAME#v}" ./release.sh

      - name: Extract CHANGELOG section for this version
        id: notes
        run: |
          VER="${GITHUB_REF_NAME#v}"
          awk -v v="$VER" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          echo "has_notes=$([ -s /tmp/release-notes.md ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release + attach zips
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: /tmp/release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.has_notes == 'no' }}
